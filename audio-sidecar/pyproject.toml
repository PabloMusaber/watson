[project]
name = "audio-sidecar"
version = "0.1.0"
description = "Audio sidecar for Watson: mic -> Deepgram -> WebSocket"
requires-python = ">=3.11"
dependencies = [
    "deepgram-sdk>=5.3.0",
    "sounddevice>=0.4.7",
    "websocket-client>=1.7.0",
    "numpy>=1.26.0",
    "evdev>=1.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_sidecar"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
audio-sidecar = "audio_sidecar.cli:main"
